name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '20 15 * * 0'

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    # java-kotlin is intentionally excluded: CodeQL cannot yet analyze Kotlin 2.4.0
    # (https://github.com/github/codeql/issues/21938). Re-add once that ships.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.2
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.36.2
        with:
          category: "/language:actions"
